<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="vangrail">
  <title>vangrail</title>
  <desc>End-on W-beam crash barrier with an amber reflector. Dutch for the steel barrier at the edge of a road.</desc>
  <defs>
    <linearGradient id="steel" x1="40" y1="56" x2="216" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e8ecef"/>
      <stop offset="0.45" stop-color="#c4c9ce"/>
      <stop offset="1" stop-color="#8d949a"/>
    </linearGradient>
    <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(58)">
      <rect width="7" height="7" fill="url(#steel)"/>
      <path d="M0 0 h7" stroke="#9aa1a7" stroke-width="2"/>
    </pattern>
    <linearGradient id="ridge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="32" fill="#9a958c"/>
  <path d="M114 176h28l6 42H108z" fill="#1b2124"/>
