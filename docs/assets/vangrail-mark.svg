  <path d="M56 92 L88 60 L112 84" fill="none" stroke="url(#ridge)" stroke-width="5" stroke-linecap="square"/>
  <path d="M144 84 L168 60 L200 92" fill="none" stroke="url(#ridge)" stroke-width="5" stroke-linecap="square"/>
