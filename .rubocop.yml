# RuboCop for vangrail (https://docs.rubocop.org)
# Run locally: `rubocop` (autocorrect: `rubocop -A`)
# CI: the `rubocop` job in .github/workflows/ci.yml, and the prek hook.
#
# The written rules are thoughtbot's Ruby guide. Their checked-in config is
# not: it is a Rails app file that disables most departments. What we take
# from it is CollectionMethods, nested class definitions, and trailing
# commas. What we keep is single quotes and named metric ceilings. See
# docs/orgmode/contributing/style.org.

plugins:
  - rubocop-performance
  - rubocop-minitest

AllCops:
  TargetRubyVersion: 3.1
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    # Generated from the Unicode confusables data by
    # script/generate_confusables.rb. Style rules on a machine-written table
    # of 1645 codepoints report on the generator's formatting choices, which
    # nobody edits and nobody reads.
    - 'lib/vangrail/confusables_data.rb'
    # Generated tables. Same reason as the confusables file.
    - 'lib/vangrail/bayes_data.rb'
    - 'lib/vangrail/evidence_data.rb'

# Nothing outside the standard library is needed at runtime, so there is no
# lockfile to police.
Bundler:
  Enabled: false
Gemspec/DevelopmentDependencies:
  Enabled: false

Layout/LineLength:
  # 120 rather than 110: what sits between the two is a regexp alternation, a
  # ternary choosing a parser, and a JSON fixture, each of which reads worse
  # broken across lines. Anything past 120 is genuinely runaway.
  Max: 120

Style/Documentation:
  # Every class and module here already carries a comment saying why it exists.
  # This cop wants a particular shape that would make several of them worse.
  Enabled: false

Metrics/MethodLength:
  Max: 45
Metrics/AbcSize:
  # 53 rather than the default 17. The methods between 17 and 53 are a
  # parser dispatch, a request builder, the incomplete beta, and
  # Engine#observe, which walks every rail and records three kinds of
  # silence. Splitting those scatters one decision. Past 53 is grown.
  Max: 53
Metrics/CyclomaticComplexity:
  Max: 24
Metrics/PerceivedComplexity:
  Max: 24
Metrics/ClassLength:
  Max: 260
Metrics/ModuleLength:
  # NLP holds the lexicons, the stemmer, and the language profiles. Those
  # are tables, not branches. 290 is the size of that file with Cavnar-
  # Trenkle in it.
  Max: 290
  Exclude:
    - 'test/**/*'
Metrics/BlockLength:
  Exclude:
    - 'test/**/*'
    # A gemspec is one block by construction and its length counts metadata
    # fields, not branches. Capping it means deleting a declaration or a
    # comment explaining one, which is not what the metric is for.
    - '*.gemspec'
Metrics/ParameterLists:
  # Rails and providers are configured through keywords, which is the readable
  # way to do it. Positional arguments stay capped.
  Max: 6
  CountKeywordArgs: false

Style/CollectionMethods:
  # thoughtbot: detect/select/map/reduce, not find/find_all/collect/inject.
  Enabled: true
  PreferredMethods:
    find: detect
    inject: reduce
    collect: map
    find_all: select

Style/ClassAndModuleChildren:
  EnforcedStyle: nested

Style/TrailingCommaInArguments:
  EnforcedStyleForMultiline: comma
Style/TrailingCommaInArrayLiteral:
  EnforcedStyleForMultiline: comma
Style/TrailingCommaInHashLiteral:
  EnforcedStyleForMultiline: comma

Style/StringLiterals:
  # thoughtbot's RuboCop wants double quotes. This library is written in
  # single quotes. The written guide is "be consistent"; we already are.
  EnforcedStyle: single_quotes

Style/RegexpLiteral:
  # The detection rails are mostly regexps, and slashes read better than %r
  # there even with an inner slash.
  EnforcedStyle: slashes
  AllowInnerSlashes: true

Style/SpecialGlobalVars:
  # `$?` after IO.popen is the idiom for a child's exit status; requiring
  # English to spell it differently buys nothing.
  Enabled: false

Naming/MethodParameterName:
  # The incomplete beta is a, b, x in every textbook. Spelling them out
  # would make the implementation harder to check against Abramowitz.
  AllowedNames:
    - a
    - b
    - x
    - n
    - p
    - k

Style/FormatStringToken:
  Exclude:
    # The probe scripts print tables. Annotated tokens make the format
    # string longer than the row.
    - 'script/**/*'

Naming/PredicateMethod:
  # `screen` and `apply` answer with a value rather than a fact about the
  # receiver, so the question-mark rule does not apply to them.
  Enabled: false

Lint/DuplicateBranch:
  # Parsers legitimately return the same shape for different reasons, and
  # collapsing the branches would hide which case was taken.
  Enabled: false
