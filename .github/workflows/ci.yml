# Tests and lint.
#
# The suite is stdlib minitest run as plain files, so there is no bundle to
# install for it. minitest stopped being a default gem in Ruby 3.4, so it is
# installed explicitly rather than assumed.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    name: test (ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.1', '3.2', '3.3', '3.4']
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: false

      - name: Install minitest
        run: gem install --no-document minitest

      # The gem promises to need nothing outside the standard library at
      # runtime. This is where that promise is checked rather than asserted:
      # the suite loads the whole library with no bundle at all.
      - name: Load the library with no bundle
        run: ruby -Ilib -e 'require "vangrail"; puts Vangrail::VERSION'

      - name: Test
        run: rake test

  lint:
    name: rubocop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: false

      - name: Install rubocop
        run: gem install --no-document rubocop

      - run: rubocop --format github

  package:
    name: gem builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: false

      # A gemspec that does not build is a release that fails at the worst
      # moment, so it is built on every change rather than at tag time.
      - name: Build
        run: gem build vangrail.gemspec

      - uses: actions/upload-artifact@v4
        with:
          name: gem
          path: '*.gem'
          if-no-files-found: error
