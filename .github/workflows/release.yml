# Builds the gem on a version tag and pushes it through RubyGems
# trusted publishing (OIDC). No long-lived API token is stored here.
#
# The matching pending/trusted publisher on RubyGems.org is:
#   owner HaoZeke, repo vangrail, workflow release.yml, environment release.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build and publish
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: false

      - name: Install minitest
        run: gem install --no-document minitest

      # The gem promises to need nothing outside the standard library at
      # runtime. This is where that promise is checked rather than asserted.
      - name: Load the library with no bundle
        run: ruby -Ilib -e 'require "vangrail"; puts Vangrail::VERSION'

      - name: Test
        run: rake test

      - name: Build
        run: gem build vangrail.gemspec

      - uses: actions/upload-artifact@v7
        with:
          name: gem
          path: '*.gem'
          if-no-files-found: error

      # Short-lived token from GitHub OIDC, exchanged at RubyGems.org.
      - name: Configure RubyGems credentials
        uses: rubygems/configure-rubygems-credentials@v1.0.0

      - name: Publish
        run: gem push ./*.gem
