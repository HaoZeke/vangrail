# Coverage is a signal, not a gate. A patch that lowers it by a fraction while
# fixing a real defect should not be blocked by a robot.
coverage:
  status:
    project:
      default:
        target: auto
        threshold: 2%
        informational: true
    patch:
      default:
        informational: true

comment:
  layout: "reach, diff, files"
  require_changes: true

ignore:
  - "test/**/*"
